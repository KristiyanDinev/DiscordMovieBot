services:
  postgres-test:
    image: postgres:18.1
    container_name: movie-bot-postgres-test
    restart: unless-stopped
    command: -c "app.user=${POSTGRES_DB_USERNAME}" -c "app.password=${POSTGRES_DB_PASSWORD}"
    #ports:
    #  - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_ROOT_PASSWORD}
    volumes:
      - moviebot-postgres-data-test:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_ROOT_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 3s
      timeout: 5s
      retries: 10           # give it ~30s max to become ready
      start_period: 5s

  pgAdmin-test:
    image: dpage/pgadmin4
    container_name: moviebot-pgadmin-test
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data-test:/var/lib/pgadmin
    ports:
       - "5050:80"

  bot-test:
    image: discordmoviebot:2.2.3
    container_name: discord-movie-bot-test
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      JAVA_OPTS: "-Xmx5G -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      POSTGRES_DB_HOST: "postgres-test"
      POSTGRES_DB_PORT: "5432"
      POSTGRES_DB_USERNAME: ${POSTGRES_DB_USERNAME}
      POSTGRES_DB_PASSWORD: ${POSTGRES_DB_PASSWORD}
      DISCORD_MOVIE_BOT_TOKEN: ${TESTING_DISCORD_BOT_TOKEN}
      REPORT_GUILD_ID: "1466675456127533107"
      REPORT_CHANNEL_ID: "1469215922144415754"
    volumes:
      - ./bot_logs:/app/logs
    depends_on:
      postgres-test:
        condition: service_healthy


volumes:
  pgadmin-data-test:
  moviebot-postgres-data-test:
    name: moviebot-postgres-data-test