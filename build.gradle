plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'me.kristiyan.moviebot'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'm2-dv8tion'
        url = 'https://m2.dv8tion.net/releases'
    }
}

dependencies {
    // JDA (Java Discord API)
    implementation libs.jda

    // SQLite JDBC Driver
    implementation libs.sqlite

    // SLF4J Simple Logger (for JDA logging)
    implementation libs.slf4j
}

application {
    mainClass = 'Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'me.kristiyan.moviebot.Main'
    }
}

shadowJar {
    archiveBaseName.set('DiscordMovieBotShadowJar')
    archiveClassifier.set('')
    archiveVersion.set('1.0.0')
    mergeServiceFiles()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Make build task depend on shadowJar
build.dependsOn shadowJar