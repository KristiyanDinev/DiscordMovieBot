plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'me.kristiyan.moviebot'
version = '2.0.1'

repositories {
    mavenCentral()
    maven {
        name = 'm2-dv8tion'
        url = 'https://m2.dv8tion.net/releases'
    }
}

dependencies {
    // JDA (Java Discord API)
    implementation libs.jda

    // postgres JDBC Driver
    implementation libs.postgres

    // Source: https://mvnrepository.com/artifact/com.zaxxer/HikariCP
    implementation libs.hikaricp

    // SLF4J Simple Logger (for JDA logging)
    implementation libs.slf4j

    implementation libs.logback

    // JPA for easier DB management
    implementation libs.jpa

    // Hibernate for easier Java code
    implementation libs.hibernate
}

application {
    mainClass = 'Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'me.kristiyan.moviebot.Main'
    }
}

shadowJar {
    archiveBaseName.set('DiscordMovieBotShadowJar')
    archiveClassifier.set('')
    archiveVersion.set('2.0.1')
    mergeServiceFiles()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Make build task depend on shadowJar
build.dependsOn shadowJar